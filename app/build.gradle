plugins { id 'com.android.application' }

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.ashenroad.sunward'
    compileSdk 36
    buildFeatures { buildConfig true }
    signingConfigs {
        if (System.getenv('SUNWARD_KEYSTORE') || keystorePropsFile.exists()) {
            localRelease {
                storeFile rootProject.file(System.getenv('SUNWARD_KEYSTORE') ?: keystoreProps.getProperty('storeFile'))
                storePassword System.getenv('SUNWARD_SIGNING_PASSWORD') ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv('SUNWARD_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
                keyPassword System.getenv('SUNWARD_SIGNING_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        applicationId 'com.ashenroad.sunward'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '1.4.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SUNWARD_KEYSTORE') || keystorePropsFile.exists()) signingConfig signingConfigs.localRelease
        }
        local {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.android.billingclient:billing:8.0.0'
}
